            env: {}
            ports: []
          - backend: geoip
            image: coscale/docker-sleep@sha256:7ac94378c23c68b47c623dee4b3ac694ed7201543df3feed668e487ef1102fc5
            env: {}
            ports: []
          - backend: lua2
            image: coscale/docker-sleep@sha256:7ac94378c23c68b47c623dee4b3ac694ed7201543df3feed668e487ef1102fc5
            env: {}
            ports: []
          - backend: tinydns
            image: coscale/docker-sleep@sha256:7ac94378c23c68b47c623dee4b3ac694ed7201543df3feed668e487ef1102fc5
            env: {}
            ports: []
          - backend: authpy
            image: coscale/docker-sleep@sha256:7ac94378c23c68b47c623dee4b3ac694ed7201543df3feed668e487ef1102fc5
            env: {}
            ports: []
          - backend: godbc_sqlite3
            image: coscale/docker-sleep@sha256:7ac94378c23c68b47c623dee4b3ac694ed7201543df3feed668e487ef1102fc5
            env: {}
            ports: []
          - backend: godbc_mssql
