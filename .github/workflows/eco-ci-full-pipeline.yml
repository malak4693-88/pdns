---
name: 'PowerDNS Full Pipeline Energy Experiment'

on:
  workflow_dispatch:

permissions: # least privileges, see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions
  contents: read
  actions: read

env:
  COMPILER: clang
  CLANG_VERSION: ${{ contains(inputs.runner-docker-image-name, 'debian-11') && '13' || '19' }}
  # github.workspace variable points to the Runner home folder. Container home folder defined below.
  REPO_HOME: '/__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}'
  BUILDER_VERSION: '0.0.0-git1'
  COVERAGE: ${{ github.repository == 'PowerDNS/pdns' && 'yes' || 'no' }}
  LLVM_PROFILE_FILE: "/tmp/code-%p.profraw"
  OPTIMIZATIONS: yes
  INV_CMD: ". ${REPO_HOME}/.venv/bin/activate && inv"
  BRANCH_NAME: ${{ inputs.branch-name || github.ref_name }}

jobs:
  get-runner-container-image:
    name: generate docker runner image name
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.get-runner-image.outputs.image-id }}
      tag: ${{ steps.get-runner-image.outputs.tag }}
    env:
      DEFAULT_IMAGE_TAG: master # update when backporting, e.g. auth-4.9.x
      DOCKER_IMAGE: ${{ inputs.runner-docker-image-name || 'base-pdns-ci-image/debian-13-pdns-base-py13' }}
    steps:
      - name: Eco-CI - Start job measurement
        id: eco_ci_start
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          json-output: 'true'
          send-data: 'false'
        continue-on-error: true
      - id: get-runner-image
        run: |
          echo "image-id=ghcr.io/powerdns/$DOCKER_IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$DEFAULT_IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Eco-CI - Record job energy
        id: eco_ci_measure
        if: ${{ always() && steps.eco_ci_start.outcome == 'success' }}
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: job-total
          send-data: 'false'
        continue-on-error: true
      - name: Eco-CI - Show job energy (Joules)
        if: ${{ always() && steps.eco_ci_measure.outcome == 'success' }}
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          display-unit: J
          display-badge: 'false'
          send-data: 'false'
        continue-on-error: true
      - name: Eco-CI - Record runner metadata
        if: ${{ always() && steps.eco_ci_measure.outcome == 'success' }}
        shell: bash
        env:
          ECO_JOB_NAME: ${{ github.job }}
          ECO_RUNNER_NAME: ${{ runner.name }}
          ECO_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          jq -n --arg job "$ECO_JOB_NAME" --arg runner "$ECO_RUNNER_NAME" --arg arch "$ECO_RUNNER_ARCH" \
            '{job: $job, runner: $runner, architecture: $arch}' > /tmp/eco-ci/job-metadata.json
        continue-on-error: true
      - name: Eco-CI - Save job measurement
        if: ${{ always() && steps.eco_ci_measure.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: eco-ci-${{ github.job }}-${{ strategy.job-index }}
          path: |
            /tmp/eco-ci/lap-data.json
            /tmp/eco-ci/job-metadata.json
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

  build-auth:
    name: build auth (${{ matrix.builder }})
    if: ${{ !github.event.schedule || vars.SCHEDULED_JOBS_BUILD_AND_TEST_ALL }}
    runs-on: ubuntu-24.04
    needs: get-runner-container-image
    container:
      image: "${{ needs.get-runner-container-image.outputs.id }}:${{ needs.get-runner-container-image.outputs.tag }}"
      env:
        FUZZING_TARGETS: yes
        UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1:suppressions=${{ env.REPO_HOME }}/build-scripts/UBSan.supp"
        UNIT_TESTS: yes
      options: --sysctl net.ipv6.conf.all.disable_ipv6=0
    strategy:
      matrix:
        builder: [autotools, meson]
      fail-fast: false
    defaults:
      run:
        working-directory: ./pdns-${{ env.BUILDER_VERSION }}
    steps:
      - name: Eco-CI - Start job measurement
        id: eco_ci_start
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          json-output: 'true'
          send-data: 'false'
        continue-on-error: true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
          submodules: recursive
          ref: ${{ inputs.branch-name }}
          persist-credentials: false
      - name: add problem matchers
        uses: ./.github/actions/problem-matchers
      - name: set up build
        uses: ./.github/actions/cache
        with:
          cache-key-base: auth-ccache-${{ matrix.builder }}
      - name: set sanitizers
        run: echo "SANITIZERS=${{ matrix.builder == 'meson' && 'address,undefined' || 'asan+ubsan' }}" >> "$GITHUB_ENV"
        working-directory: .
      - name: install pip build dependencies
        uses: ./.github/actions/pip-build-dependencies
        with:
          venv-parent: ${{ env.REPO_HOME }}
          working-directory: .
      - run: ${{ env.INV_CMD }} install-auth-build-deps
        working-directory: .
      - run: ${{ env.INV_CMD }} ci-autoconf ${{ matrix.builder == 'meson' && '--meson' || '' }}
        working-directory: .
      - run: ${{ env.INV_CMD }} ci-auth-configure ${{ matrix.builder == 'meson' && '--meson' || '' }} -b pdns-${{ env.BUILDER_VERSION }}
        working-directory: .
      - run: ${{ env.INV_CMD }} ci-auth-build ${{ matrix.builder == 'meson' && '--meson' || '' }} # This runs under pdns-$BUILDER_VERSION/pdns/ for make bear
      - run: ${{ env.INV_CMD }} ci-auth-install-remotebackend-test-deps
      - if: ${{ matrix.builder == 'meson' }}
        run: ${{ env.INV_CMD }} install-auth-test-deps-only -b geoip
      - run: ${{ env.INV_CMD }} ci-auth-run-unit-tests ${{ matrix.builder == 'meson' && '--meson' || '' }}
        env:
          PDNS_BUILD_PATH: ../pdns-${{ env.BUILDER_VERSION }}
      - run: ${{ env.INV_CMD }} generate-coverage-info ./pdns-auth-testrunner 'auth' $GITHUB_WORKSPACE
        if: ${{ env.COVERAGE == 'yes' && matrix.builder == 'meson' }}
      - name: Coveralls Parallel auth unit
        if: ${{ env.COVERAGE == 'yes' && matrix.builder == 'meson' }}
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e
        with:
          flag-name: auth-unit-${{ env.SANITIZERS }}
          path-to-lcov: $GITHUB_WORKSPACE/coverage.lcov
          parallel: true
          allow-empty: true
          fail-on-error: false
      - run: ${{ env.INV_CMD }} ci-auth-install ${{ matrix.builder == 'meson' && '--meson' || '' }}
      - run: ccache -s
      - uses: ./.github/actions/normalize-branch-name
        if: ${{ matrix.builder == 'meson' }}
      - name: Prepare binaries folder
        if: ${{ matrix.builder == 'meson' }}
        run: |
          mkdir -p /opt/pdns-auth/bin
          for i in $(find . -maxdepth 1 -type f -executable); do cp ${i} /opt/pdns-auth/bin/; done
          mkdir -p /opt/pdns-auth/sbin; mv /opt/pdns-auth/bin/pdns_server /opt/pdns-auth/sbin/
      - if: ${{ matrix.builder == 'meson' }}
        name: Store the binaries
        uses: actions/upload-artifact@v7 # this takes 30 seconds, maybe we want to tar
        with:
          name: pdns-auth-${{ matrix.builder}}-${{ env.normalized-branch-name }}
          path: /opt/pdns-auth
          retention-days: 1
      - name: Eco-CI - Record job energy
        id: eco_ci_measure
        if: ${{ always() && steps.eco_ci_start.outcome == 'success' }}
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: job-total
          send-data: 'false'
        continue-on-error: true
      - name: Eco-CI - Show job energy (Joules)
        if: ${{ always() && steps.eco_ci_measure.outcome == 'success' }}
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          display-unit: J
          display-badge: 'false'
          send-data: 'false'
        continue-on-error: true
      - name: Eco-CI - Record runner metadata
        if: ${{ always() && steps.eco_ci_measure.outcome == 'success' }}
        shell: bash
        env:
          ECO_JOB_NAME: ${{ github.job }}
          ECO_RUNNER_NAME: ${{ runner.name }}
          ECO_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          jq -n --arg job "$ECO_JOB_NAME" --arg runner "$ECO_RUNNER_NAME" --arg arch "$ECO_RUNNER_ARCH" \
            '{job: $job, runner: $runner, architecture: $arch}' > /tmp/eco-ci/job-metadata.json
        continue-on-error: true
      - name: Eco-CI - Save job measurement
        if: ${{ always() && steps.eco_ci_measure.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: eco-ci-${{ github.job }}-${{ strategy.job-index }}
          path: |
            /tmp/eco-ci/lap-data.json
            /tmp/eco-ci/job-metadata.json
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

  build-recursor:
    name: build recursor
    if: ${{ !github.event.schedule || vars.SCHEDULED_JOBS_BUILD_AND_TEST_ALL }}
    runs-on: ubuntu-24.04
    needs: get-runner-container-image
    strategy:
      matrix:
        sanitizers: [asan+ubsan, tsan]
        features: [least, full]
        exclude:
          - sanitizers: tsan
            features: least
      fail-fast: false
    container:
      image: "${{ needs.get-runner-container-image.outputs.id }}:${{ needs.get-runner-container-image.outputs.tag }}"
      env:
        SANITIZERS: ${{ matrix.sanitizers }}
        UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1:suppressions=${{ env.REPO_HOME }}/build-scripts/UBSan.supp"
        ASAN_OPTIONS: "detect_stack_use_after_return=0"
        UNIT_TESTS: yes
        CARGO_USE_DEV: 1
      options: --sysctl net.ipv6.conf.all.disable_ipv6=0
    defaults:
      run:
        working-directory: ./pdns/recursordist/pdns-recursor-${{ env.BUILDER_VERSION }}
    steps:
      - name: Eco-CI - Start job measurement
        id: eco_ci_start
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          json-output: 'true'
          send-data: 'false'
        continue-on-error: true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
          submodules: recursive
          ref: ${{ inputs.branch-name }}
          persist-credentials: false
      - name: add problem matchers
        uses: ./.github/actions/problem-matchers
      - name: set up build
        uses: ./.github/actions/cache
        with:
          cache-key-base: recursor-ccache-meson-${{ matrix.features }}-${{ matrix.sanitizers }}
      - name: install pip build dependencies
        uses: ./.github/actions/pip-build-dependencies
        with:
          venv-parent: ${{ env.REPO_HOME }}
          working-directory: .
      - run: ${{ env.INV_CMD }} install-rec-build-deps
        working-directory: ./pdns/recursordist/
      - run: ${{ env.INV_CMD }} ci-install-rust ${REPO_HOME}
        working-directory: ./pdns/recursordist/
      - run: ${{ env.INV_CMD }} ci-rec-configure ${{ matrix.features }} pdns-recursor-${{ env.BUILDER_VERSION }}
        working-directory: ./pdns/recursordist/
      - run: ${{ env.INV_CMD }} ci-rec-run-ninja pdns-recursor-${{ env.BUILDER_VERSION }}
        working-directory: ./pdns/recursordist/
      - run: ${{ env.INV_CMD }} ci-rec-run-unit-tests
      - run: ${{ env.INV_CMD }} generate-coverage-info ./testrunner 'recursor' $GITHUB_WORKSPACE
        if: ${{ env.COVERAGE == 'yes' && matrix.sanitizers != 'tsan' }}
      - name: Coveralls Parallel rec unit
        if: ${{ env.COVERAGE == 'yes' && matrix.sanitizers != 'tsan' }}
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e
        with:
          flag-name: rec-unit-${{ matrix.features }}-${{ matrix.sanitizers }}
          path-to-lcov: $GITHUB_WORKSPACE/coverage.lcov
          parallel: true
          allow-empty: true
          fail-on-error: false
      - run: ${{ env.INV_CMD }} ci-rec-install
      - run: ccache -s
      - uses: ./.github/actions/normalize-branch-name
      - name: Store the binaries
        uses: actions/upload-artifact@v7 # this takes 30 seconds, maybe we want to tar
        with:
          name: pdns-recursor-${{ matrix.features }}-${{ matrix.sanitizers }}-meson-${{ env.normalized-branch-name }}
          path: /opt/pdns-recursor
          retention-days: 1
      - name: Eco-CI - Record job energy
        id: eco_ci_measure
        if: ${{ always() && steps.eco_ci_start.outcome == 'success' }}
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: job-total
          send-data: 'false'
        continue-on-error: true
      - name: Eco-CI - Show job energy (Joules)
        if: ${{ always() && steps.eco_ci_measure.outcome == 'success' }}
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          display-unit: J
          display-badge: 'false'
          send-data: 'false'
        continue-on-error: true
      - name: Eco-CI - Record runner metadata
        if: ${{ always() && steps.eco_ci_measure.outcome == 'success' }}
        shell: bash
        env:
          ECO_JOB_NAME: ${{ github.job }}
          ECO_RUNNER_NAME: ${{ runner.name }}
          ECO_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          jq -n --arg job "$ECO_JOB_NAME" --arg runner "$ECO_RUNNER_NAME" --arg arch "$ECO_RUNNER_ARCH" \
            '{job: $job, runner: $runner, architecture: $arch}' > /tmp/eco-ci/job-metadata.json
        continue-on-error: true
      - name: Eco-CI - Save job measurement
        if: ${{ always() && steps.eco_ci_measure.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: eco-ci-${{ github.job }}-${{ strategy.job-index }}
          path: |
            /tmp/eco-ci/lap-data.json
            /tmp/eco-ci/job-metadata.json
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

  build-dnsdist:
    name: build dnsdist
    if: ${{ !github.event.schedule || vars.SCHEDULED_JOBS_BUILD_AND_TEST_ALL }}
    runs-on: ${{ ( vars.REPOSITORY_USE_UBICLOUD == '1' ) && format('ubicloud-standard-4{0}-ubuntu-2404', matrix.architecture_suffix) || format('ubuntu-24.04{0}', matrix.architecture_suffix) }}
    needs: get-runner-container-image
    strategy:
      matrix:
        sanitizers: [asan+ubsan, tsan]
        features: [least, full]
        architecture_suffix: ${{ contains(needs.get-runner-container-image.outputs.id, 'debian-11') && fromJson('[""]') || fromJson('["", "-arm"]') }}
        exclude:
          - sanitizers: tsan
            features: least
          - architecture_suffix: '-arm'
            features: least
          - architecture_suffix: '-arm'
            sanitizers: tsan
      fail-fast: false
    container:
      image: "${{ needs.get-runner-container-image.outputs.id }}:${{ needs.get-runner-container-image.outputs.tag }}"
      env:
        SANITIZERS: ${{ matrix.sanitizers }}
        UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1:suppressions=${{ env.REPO_HOME }}/build-scripts/UBSan.supp"
        UNIT_TESTS: yes
        FUZZING_TARGETS: yes
        CARGO_USE_DEV: 1
      options: --sysctl net.ipv6.conf.all.disable_ipv6=0
    defaults:
      run:
        working-directory: ./pdns/dnsdistdist/dnsdist-${{ env.BUILDER_VERSION }}
    steps:
      - name: Eco-CI - Start job measurement
        id: eco_ci_start
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          json-output: 'true'
          send-data: 'false'
        continue-on-error: true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
          submodules: recursive
          ref: ${{ inputs.branch-name }}
          persist-credentials: false
      - name: add problem matchers
        uses: ./.github/actions/problem-matchers
      - name: set up build
        uses: ./.github/actions/cache
        with:
          cache-key-base: dnsdist-${{ matrix.features }}-${{ matrix.sanitizers }}-meson${{ matrix.architecture_suffix }}-ccache
      - name: install pip build dependencies
        uses: ./.github/actions/pip-build-dependencies
        with:
          venv-parent: ${{ env.REPO_HOME }}
          working-directory: .
      - run: ${{ env.INV_CMD }} install-dnsdist-build-deps
        working-directory: .
      - run: ${{ env.INV_CMD }} install-clang
        working-directory: .
      - run: ${{ env.INV_CMD }} install-lld-linker-if-needed
        working-directory: ./pdns/dnsdistdist/
      - run: ${{ env.INV_CMD }} ci-install-rust ${REPO_HOME}
        working-directory: ./pdns/dnsdistdist/
      - run: ${{ env.INV_CMD }} ci-build-and-install-quiche ${REPO_HOME}
        if: ${{ matrix.features != 'least' }}
        working-directory: ./pdns/dnsdistdist/
      - run: ${{ env.INV_CMD }} ci-dnsdist-configure ${{ matrix.features }} dnsdist-${{ env.BUILDER_VERSION }} --mockAsyncEngine
        working-directory: ./pdns/dnsdistdist/
      - run: ${{ env.INV_CMD }} ci-dnsdist-run-ninja dnsdist-${{ env.BUILDER_VERSION }}
        working-directory: ./pdns/dnsdistdist/
      - run: ${{ env.INV_CMD }} ci-dnsdist-run-unit-tests
      - run: ${{ env.INV_CMD }} generate-coverage-info ./testrunner 'dnsdist' $GITHUB_WORKSPACE
        if: ${{ env.COVERAGE == 'yes' && matrix.sanitizers != 'tsan' }}
      - name: Coveralls Parallel dnsdist unit
        if: ${{ env.COVERAGE == 'yes' && matrix.sanitizers != 'tsan' }}
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e
        with:
          flag-name: dnsdist-unit-${{ matrix.features }}-${{ matrix.sanitizers }}
          path-to-lcov: $GITHUB_WORKSPACE/coverage.lcov
          parallel: true
          allow-empty: true
          fail-on-error: false
      - run: ${{ env.INV_CMD }} ci-dnsdist-install
      - run: ccache -s
      - uses: ./.github/actions/normalize-branch-name
      - name: Prepare binaries folder
        run: |
          mkdir -p /opt/dnsdist/bin
          for i in $(find . -maxdepth 1 -type f -executable); do cp ${i} /opt/dnsdist/bin/; done
      - name: Store the binaries
        uses: actions/upload-artifact@v7 # this takes 30 seconds, maybe we want to tar
        with:
          name: dnsdist-${{ matrix.features }}-${{ matrix.sanitizers }}-meson${{ matrix.architecture_suffix }}-${{ env.normalized-branch-name }}
          path: /opt/dnsdist
          retention-days: 1
      - name: Eco-CI - Record job energy
        id: eco_ci_measure
        if: ${{ always() && steps.eco_ci_start.outcome == 'success' }}
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: job-total
          send-data: 'false'
        continue-on-error: true
      - name: Eco-CI - Show job energy (Joules)
        if: ${{ always() && steps.eco_ci_measure.outcome == 'success' }}
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          display-unit: J
          display-badge: 'false'
          send-data: 'false'
        continue-on-error: true
      - name: Eco-CI - Record runner metadata
        if: ${{ always() && steps.eco_ci_measure.outcome == 'success' }}
        shell: bash
        env:
          ECO_JOB_NAME: ${{ github.job }}
          ECO_RUNNER_NAME: ${{ runner.name }}
          ECO_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          jq -n --arg job "$ECO_JOB_NAME" --arg runner "$ECO_RUNNER_NAME" --arg arch "$ECO_RUNNER_ARCH" \
            '{job: $job, runner: $runner, architecture: $arch}' > /tmp/eco-ci/job-metadata.json
        continue-on-error: true
      - name: Eco-CI - Save job measurement
        if: ${{ always() && steps.eco_ci_measure.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: eco-ci-${{ github.job }}-${{ strategy.job-index }}
          path: |
            /tmp/eco-ci/lap-data.json
            /tmp/eco-ci/job-metadata.json
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

  test-auth-api:
    needs:
      - build-auth
      - get-runner-container-image
    runs-on: ubuntu-24.04
    container:
      image: "${{ needs.get-runner-container-image.outputs.id }}:${{ needs.get-runner-container-image.outputs.tag }}"
      env:
        UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1:suppressions=${{ env.REPO_HOME }}/build-scripts/UBSan.supp"
        ASAN_OPTIONS: detect_leaks=0
        TSAN_OPTIONS: "halt_on_error=1:suppressions=${{ env.REPO_HOME }}/pdns/dnsdistdist/dnsdist-tsan.supp"
        AUTH_BACKEND_IP_ADDR: "172.17.0.1"
      options: --sysctl net.ipv6.conf.all.disable_ipv6=0
    strategy:
      matrix:
        include:
          - backend: gsqlite3
            image: coscale/docker-sleep@sha256:7ac94378c23c68b47c623dee4b3ac694ed7201543df3feed668e487ef1102fc5
          - backend: gmysql
            image: mysql@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb # mysql:5.7.44
          - backend: gpgsql
            image: postgres@sha256:bbcaba1d74865ee6d6318b5e297d0df73d1f6b6d995cd892b60a2cf1440b716a # postgres:14.18
          - backend: lmdb
            image: coscale/docker-sleep@sha256:7ac94378c23c68b47c623dee4b3ac694ed7201543df3feed668e487ef1102fc5
      fail-fast: false
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: runner
          POSTGRES_HOST_AUTH_METHOD: trust
          MYSQL_ALLOW_EMPTY_PASSWORD: 1
        ports:
          - 3306:3306
          - 5432:5432
        # FIXME: this works around dist-upgrade stopping all docker containers. dist-upgrade is huge on these images anyway. Perhaps we do want to run our tasks in a Docker container too.
        options: >-
          --restart always
    steps:
      - name: Eco-CI - Start job measurement
        id: eco_ci_start
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          json-output: 'true'
          send-data: 'false'
        continue-on-error: true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
          submodules: recursive
          ref: ${{ inputs.branch-name }}
          persist-credentials: false
      - name: add problem matchers
        uses: ./.github/actions/problem-matchers
      - uses: ./.github/actions/normalize-branch-name
      - name: Fetch the binaries
        uses: actions/download-artifact@v8
        with:
          name: pdns-auth-meson-${{ env.normalized-branch-name }}
          path: /opt/pdns-auth
      - name: install pip build dependencies
        uses: ./.github/actions/pip-build-dependencies
        with:
          venv-parent: ${{ env.REPO_HOME }}
          working-directory: .
      - run: ${{ env.INV_CMD }} apt-fresh
      - run: ${{ env.INV_CMD }} install-clang-runtime
