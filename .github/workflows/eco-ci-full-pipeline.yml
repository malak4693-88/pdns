          display-badge: 'false'
          send-data: 'false'
        continue-on-error: true
      - name: Eco-CI - Record runner metadata
        if: ${{ always() && steps.eco_ci_measure.outcome == 'success' }}
        shell: bash
        env:
          ECO_JOB_NAME: ${{ github.job }}
          ECO_RUNNER_NAME: ${{ runner.name }}
          ECO_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          jq -n --arg job "$ECO_JOB_NAME" --arg runner "$ECO_RUNNER_NAME" --arg arch "$ECO_RUNNER_ARCH" \
            '{job: $job, runner: $runner, architecture: $arch}' > /tmp/eco-ci/job-metadata.json
        continue-on-error: true
      - name: Eco-CI - Save job measurement
        if: ${{ always() && steps.eco_ci_measure.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: eco-ci-${{ github.job }}-${{ strategy.job-index }}
          path: |
            /tmp/eco-ci/lap-data.json
            /tmp/eco-ci/job-metadata.json
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
      - name: Eco-CI - Download every job's energy record
        if: ${{ always() }}
        uses: actions/download-artifact@v8
        with:
          pattern: eco-ci-*
          path: eco-ci-collected
        continue-on-error: true
      - name: Eco-CI - Summarize full pipeline energy
        if: ${{ always() }}
        shell: bash
        env:
          ECO_CI_NEEDS_JSON: ${{ toJSON(needs) }}
          ECO_API_URL: ${{ github.api_url }}
          ECO_REPOSITORY: ${{ github.repository }}
          ECO_RUN_ID: ${{ github.run_id }}
          ECO_GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import csv
          import json
          import math
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          root = Path('eco-ci-collected')
          rows = []
          errors = []
          for path in sorted(root.glob('**/lap-data.json')):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
                  steps = data['steps']
                  if len(steps) != 1:
                      raise ValueError('Expected exactly one measurement')
                  energy = float(steps[0]['energy_joules'])
                  duration = float(steps[0]['time'])
                  if not math.isfinite(energy) or energy < 0:
                      raise ValueError('Energy value invalid')
                  metadata_path = path.parent / 'job-metadata.json'
                  metadata = json.loads(metadata_path.read_text(encoding='utf-8')) if metadata_path.exists() else {}
                  rows.append({
                      'job': path.parent.name,
                      'energy_joules': round(energy, 6),
                      'duration_seconds': round(duration, 3),
                      'runner': metadata.get('runner', 'unknown'),
                      'architecture': metadata.get('architecture', 'unknown'),
                  })
              except (OSError, KeyError, ValueError, TypeError, json.JSONDecodeError) as exc:
                  errors.append(f'{path}: {exc}')

          # Ask GitHub which matrix jobs really ran; otherwise a missing artifact
          # could silently make the pipeline total look artificially low.
          expected = None
          try:
              api_jobs = []
              page = 1
              while True:
                  url = f"{os.environ['ECO_API_URL']}/repos/{os.environ['ECO_REPOSITORY']}/actions/runs/{os.environ['ECO_RUN_ID']}/jobs?per_page=100&page={page}"
                  request = Request(url, headers={
                      'Authorization': f"Bearer {os.environ['ECO_GH_TOKEN']}",
                      'Accept': 'application/vnd.github+json',
                  })
                  with urlopen(request, timeout=20) as response:
                      batch = json.load(response).get('jobs', [])
                  api_jobs.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              if not api_jobs:
                  raise ValueError('No GitHub job inventory returned')
              expected = sum(1 for job in api_jobs if job.get('conclusion') != 'skipped'
                             and job.get('name') != 'collect') + 1
          except Exception as exc:
              errors.append(f'Could not validate job count with GitHub API: {exc}')

          needs = json.loads(os.environ['ECO_CI_NEEDS_JSON'])
          unsuccessful = [name for name, info in needs.items()
                          if info.get('result') in ('failure', 'cancelled')]
          unusual_runners = [row['job'] for row in rows
                             if row['architecture'] != 'X64' or 'ubicloud' in row['runner'].lower()]
          complete = (expected is not None and len(rows) == expected
                      and not errors and not unsuccessful)
          total = round(sum(row['energy_joules'] for row in rows), 6)

          with open('eco-ci-job-energy.csv', 'w', newline='', encoding='utf-8') as output:
              writer = csv.DictWriter(output, fieldnames=['job', 'energy_joules', 'duration_seconds', 'runner', 'architecture'])
              writer.writeheader()
              writer.writerows(rows)
          result = {
              'estimated_energy_joules_measured_jobs': total,
              'measured_jobs': len(rows),
              'expected_jobs': expected,
              'complete': complete,
              'uncalibrated_or_nonstandard_runners': unusual_runners,
              'failed_or_cancelled_job_groups': unsuccessful,
              'errors': errors,
          }
          Path('eco-ci-pipeline-total.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          status = 'COMPLETE (estimated)' if complete else 'PARTIAL / NOT COMPARABLE'
          summary = [
              '## Eco-CI — full pipeline energy',
              f'- Result: **{status}**',
              f'- Estimated energy of measured jobs: **{total:.2f} J**',
              f'- Collected job measurements: **{len(rows)}**' + (f' / {expected} expected' if expected is not None else ' (expected count unknown)'),
              '- Duration values are per job; do not sum them as pipeline wall time.',
              '- Measurement covers steps after Eco-CI starts, excluding VM provisioning and the final aggregation.',
          ]
          if unusual_runners:
              summary.append('- **Warning:** Runner power profiles need validation for: ' + ', '.join(unusual_runners))
          if unsuccessful:
              summary.append('- **Warning:** Failed/cancelled job groups: ' + ', '.join(unsuccessful))
          if errors:
              summary.extend('- Warning: ' + entry for entry in errors)
          summary.append('- Download the CSV and JSON artifacts for the graduation research.')
          print('\n'.join(summary))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('\n'.join(summary) + '\n')
          PY
      - name: Eco-CI - Upload pipeline CSV and JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: eco-ci-pipeline-summary
          path: |
            eco-ci-job-energy.csv
            eco-ci-pipeline-total.json
          if-no-files-found: warn
          retention-days: 30
        continue-on-error: true
